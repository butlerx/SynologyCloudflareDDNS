[project]
name            = "synology-cloudflare-ddns"
version         = "0.2.0"
description     = "A simple script to update CloudFlare DDNS for Synology NAS."
authors         = [{ name = "Cian Butler", email = "butlerx@notthe.cloud" }]
readme          = "README.md"
license         = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies    = ["cloudflare>=2.19,<5.11", "orjson", "python-json-logger >= 4.0.0"]
classifiers     = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/butlerx/SynologyCloudflareDDNS"
Issues   = "https://github.com/butlerx/SynologyCloudflareDDNS/issues"

[project.scripts]
synology_cloudflare_ddns = "synology_cloudflare_ddns.__main__:main"

[dependency-groups]
dev    = [
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "typing" },
]
lint   = ["ruff"]
test   = ["pytest>=9.0.3"]
typing = ["ty"]

[build-system]
requires      = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",       # conflicts with ruff format
  "CPY001",       # licence lives in LICENSE
  "D203",         # conflicts with D211
  "D212",         # conflicts with D213
  "FIX002",       # TODOs are allowed
  "TD003",        # TODOs don't need issue links
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D103", "INP001", "PLR2004", "S101"]

[tool.ruff.lint.isort]
combine-as-imports = true
